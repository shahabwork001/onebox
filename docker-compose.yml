# Local development only. All inline credentials and fallback values below are
# intentionally non-production defaults; supply real secrets outside this file.
name: centralchat
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: centralchat
      POSTGRES_USER: centralchat
      POSTGRES_PASSWORD: centralchat_dev
    ports: ["55432:5432"]
    volumes: ["centralchat_postgres18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centralchat -d centralchat"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["centralchat_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: centralchat
      RABBITMQ_DEFAULT_PASS: centralchat_dev
    ports: ["5672:5672", "15672:15672"]
    volumes: ["centralchat_rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: src/CentralChat.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=centralchat;Username=centralchat;Password=centralchat_dev
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      RabbitMq__Host: rabbitmq
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DEVELOPMENT-ONLY-change-with-environment-variable-32chars}
      MetaWhatsApp__VerifyToken: ${META_VERIFY_TOKEN:-development-verify-token}
      MetaWhatsApp__AppSecret: ${META_APP_SECRET:-development-app-secret}
      MetaWhatsApp__AccessToken: ${META_ACCESS_TOKEN:-development-access-token}
      MetaWhatsApp__ValidateSignature: ${META_VALIDATE_SIGNATURE:-false}
      MetaWhatsApp__UseDevelopmentClient: ${META_USE_DEVELOPMENT_CLIENT:-true}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Bootstrap__AdminDisplayName: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
      Bootstrap__AdminRole: ${BOOTSTRAP_ADMIN_ROLE:-SuperAdmin}
      Bootstrap__AgentEmails: ${BOOTSTRAP_AGENT_EMAILS:-}
      Bootstrap__AgentPassword: ${BOOTSTRAP_AGENT_PASSWORD:-}
      Bootstrap__TeamName: ${BOOTSTRAP_TEAM_NAME:-Support}
    volumes: ["centralchat_media:/var/lib/onebox/media"]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  centralchat_media:
  centralchat_postgres18:
  centralchat_redis:
  centralchat_rabbitmq:
