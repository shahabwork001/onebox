name: Production Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore CentralChat.sln --configfile NuGet.Config

      - name: Build .NET solution
        run: dotnet build CentralChat.sln --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test CentralChat.sln --configuration Release --no-build --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish:
    name: Publish production images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/CentralChat.API/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shahabwork001/unidesk-api:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/shahabwork001/unidesk-api:production' || '' }}
          cache-from: type=gha,scope=unidesk-api
          cache-to: type=gha,mode=max,scope=unidesk-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ghcr.io/shahabwork001/unidesk-web:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/shahabwork001/unidesk-web:production' || '' }}
          cache-from: type=gha,scope=unidesk-web
          cache-to: type=gha,mode=max,scope=unidesk-web
